<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Thẻ Từ Vựng N2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one calm column. Header, five tabs, fixed bottom bar. The only saturated object is the flashcard face. */
:root{
  --bg:#F0F2F9; --surface:#FFFFFF; --surface2:#E6E9F5; --ink:#161A3A; --muted:#565C86; --line:#D3D8EC;
  --accent:#2F44E0; --accent-ink:#FFFFFF; --accent-soft:#E0E4FC;
  --good:#0F7560; --good-soft:#D8F0E9; --warn:#B04A10; --warn-soft:#FBE5D6;
  --face:#2F44E0; --on-face:#FFFFFF;
  --h0:#E6E9F5; --h1:#C3CBF7; --h2:#8E9BF0; --h3:#5565E6; --h4:#2F44E0;
  --shadow:0 1px 2px rgba(22,26,58,.08),0 10px 28px rgba(22,26,58,.10);
  --f-ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-jp:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1125; --surface:#171B38; --surface2:#20254A; --ink:#E9EBFB; --muted:#A3A9D3; --line:#2C3262;
  --accent:#93A1FF; --accent-ink:#0E1125; --accent-soft:#252C63;
  --good:#5FD3B3; --good-soft:#133A35; --warn:#FFA46B; --warn-soft:#45291A;
  --face:#3A4EEA; --on-face:#FFFFFF;
  --h0:#20254A; --h1:#262D66; --h2:#3A47A0; --h3:#5B6BDC; --h4:#93A1FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1125; --surface:#171B38; --surface2:#20254A; --ink:#E9EBFB; --muted:#A3A9D3; --line:#2C3262;
  --accent:#93A1FF; --accent-ink:#0E1125; --accent-soft:#252C63;
  --good:#5FD3B3; --good-soft:#133A35; --warn:#FFA46B; --warn-soft:#45291A;
  --face:#3A4EEA; --on-face:#FFFFFF;
  --h0:#20254A; --h1:#262D66; --h2:#3A47A0; --h3:#5B6BDC; --h4:#93A1FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto}
.jp{font-family:var(--f-jp)}
h1,h2,h3,p{margin:0}
h2{font-size:1.05rem;font-weight:700;text-wrap:balance}
h3{font-size:1rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:var(--face);color:var(--on-face);display:grid;place-items:center;font-family:var(--f-jp);font-weight:700;font-size:1.25rem;flex:none}
.brand h1{font-size:1.1rem;font-weight:700;line-height:1.2}
.brand p{font-size:.78rem;color:var(--muted)}
.topr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:.8rem;font-weight:500;white-space:nowrap}
button.chip:hover{border-color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.synced{background:var(--good)} .dot.saving{background:var(--accent)} .dot.error{background:var(--warn)}
.icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:.7rem;font-weight:500;color:var(--muted);min-width:0}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* buttons, forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:6px 11px;font-size:.82rem;border-radius:10px}
.btn.lg{padding:14px 20px;font-size:1rem;width:100%}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
label.f{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
label.f .in{font-weight:400;color:var(--ink)}
.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-size:.84rem;font-weight:600;color:var(--muted);min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stack{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.panel.hero{padding:20px}
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.meter>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.good>span{background:var(--good)}
.prow{display:grid;gap:5px}
.prow .l{display:flex;justify-content:space-between;font-size:.86rem;font-weight:500}
.big-n{font-size:1.5rem;font-weight:700;line-height:1.25;text-wrap:balance}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;font-size:.84rem}
.legend b{font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.heat{display:grid;grid-template-rows:repeat(7,18px);grid-auto-flow:column;grid-auto-columns:18px;gap:3px;overflow-x:auto;padding-bottom:2px}
.heat i{display:block;border-radius:4px;background:var(--h0)}
.heat i.l1{background:var(--h1)} .heat i.l2{background:var(--h2)} .heat i.l3{background:var(--h3)} .heat i.l4{background:var(--h4)} .heat i.fut{background:transparent}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.listbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:grid;gap:2px}
.listbtn b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.listbtn.ng b{color:var(--warn)} .listbtn.ok b{color:var(--good)}
.note{font-size:.88rem;color:var(--muted)}
.banner{background:var(--good-soft);color:var(--good);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.9rem}

/* study */
.modes{display:grid;gap:8px}
.mode{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:grid;gap:2px}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.mode .t span{font-weight:500;color:var(--muted);font-size:.85rem;white-space:nowrap}
.sess-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card3d{display:grid;perspective:1400px;cursor:pointer;outline-offset:4px}
.card3d .inner{display:grid;transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card3d.flip .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;min-height:340px;padding:22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;box-shadow:var(--shadow)}
.face.front{background:var(--face);color:var(--on-face)}
.face.back{background:var(--surface);border:1px solid var(--line);transform:rotateY(180deg)}
.face .tag{font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.face .word{font-family:var(--f-jp);font-weight:700;font-size:clamp(2.3rem,12vw,3.8rem);line-height:1.2;overflow-wrap:anywhere}
.face .vi-big{font-weight:700;font-size:clamp(1.5rem,6.5vw,2.1rem);line-height:1.3;text-wrap:balance}
.face .read{font-family:var(--f-jp);opacity:.85;font-size:1.05rem}
.face .hint{font-size:.8rem;opacity:.75;margin-top:6px}
.face .sep{width:48px;height:2px;background:var(--line);border-radius:2px}
.face .exjp{font-family:var(--f-jp);font-size:1.12rem;line-height:1.7;text-wrap:balance}
.face .exvi{font-size:.9rem;color:var(--muted);text-wrap:balance}
.face .lab{font-size:.72rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.spk{border:1px solid currentColor;background:transparent;color:inherit;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0;opacity:.9}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .btn{padding:15px 10px;font-size:1rem}
.keys{font-size:.76rem;color:var(--muted);text-align:center}
.res{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.res li{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-radius:10px;background:var(--surface2)}
.res .jp{font-weight:700;font-size:1.05rem}
.res .vi{font-size:.85rem;color:var(--muted);min-width:0}

/* path */
.path{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.stg{display:grid;grid-template-columns:36px 1fr;gap:14px;position:relative}
.stg:not(:last-child)::before{content:"";position:absolute;left:17px;top:38px;bottom:-14px;width:2px;background:var(--line)}
.node{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface2);color:var(--muted);border:2px solid var(--line);z-index:1}
.stg.done .node{background:var(--good);border-color:var(--good);color:var(--surface)}
.stg.current .node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stg.locked{opacity:.65}
.sbody{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.stg.current .sbody{border-color:var(--accent)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.ng{background:var(--warn-soft);color:var(--warn)} .pill.cur{background:var(--accent-soft);color:var(--accent)}

/* words */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.82rem;font-weight:600}
.chipb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{border-bottom:1px solid var(--line)} .wrow:last-child{border-bottom:0}
.wmain{width:100%;border:0;background:none;text-align:left;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.wjp{font-family:var(--f-jp);font-weight:700;font-size:1.15rem;overflow-wrap:anywhere}
.wvi{grid-column:1;font-size:.88rem;color:var(--muted)}
.wbadge{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.wdet{padding:2px 14px 14px;display:grid;gap:10px}
.wdet .exjp{font-family:var(--f-jp);font-size:1.02rem;line-height:1.7}
.wdet .exvi{font-size:.88rem;color:var(--muted)}
.gtags{font-size:.76rem;color:var(--muted)}
.wform{border-color:var(--accent)}
.gsel{display:flex;gap:6px;flex-wrap:wrap}
.gsel label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:.82rem;font-weight:500;cursor:pointer;background:var(--surface)}
.gsel label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.gsel input{accent-color:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
textarea.in{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}

/* quiz */
.qcard{text-align:center;justify-items:center;gap:10px;padding:22px 16px}
.qcard .lab{font-size:.72rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.qword{font-family:var(--f-jp);font-weight:700;font-size:clamp(2.1rem,10vw,3.2rem);line-height:1.25;overflow-wrap:anywhere}
.qvi{font-weight:700;font-size:clamp(1.3rem,6vw,1.8rem);line-height:1.35;text-wrap:balance}
.qsent{font-family:var(--f-jp);font-size:1.25rem;line-height:1.8;text-wrap:balance}
.qcard .read{font-family:var(--f-jp);color:var(--muted)}
.qcard .exvi{font-size:.9rem;color:var(--muted);text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:500;line-height:1.4}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none;color:var(--muted)}
.opt .jp{font-weight:700;font-size:1.1rem}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt:hover:not([aria-disabled="true"]){border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.correct .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.opt.wrong .k{background:var(--warn);color:var(--surface)}
.qfb{border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;border:1.5px solid}
.qfb p{margin:0}
.qfb.good{background:var(--good-soft);border-color:var(--good)}
.qfb.bad{background:var(--warn-soft);border-color:var(--warn)}
.qfb.good>b{color:var(--good)} .qfb.bad>b{color:var(--warn)}
.qfb .jp{font-family:var(--f-jp)}
.big-score{font-size:2.4rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9;max-width:min(92vw,420px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.card3d .inner,#toast{transition:none}}
@media (max-width:420px){.face{min-height:310px;padding:18px}}
</style>

<script>
(function(){
'use strict';

/* ---------- Dữ liệu gốc: [từ, nghĩa, nhóm, câu mẫu, dịch câu mẫu, cách đọc?] ---------- */
const GROUPS0=[
  {id:'e',name:'Cảm xúc',sub:'Gặp nhiều trong giao tiếp'},

  {id:'b',name:'Trạng thái cơ thể',sub:'Rất hay dùng'},
  {id:'s',name:'Âm thanh',sub:'Thường gặp trong manga, anime và bài đọc'},
  {id:'p',name:'Tính chất, hình dạng, số lượng',sub:'Mô tả đồ vật và số lượng'},
  {id:'d',name:'Mức độ, thời gian, tần suất',sub:'Hữu ích cho N3–N2'}
];
const BASE=[
['ドキドキする','Tim đập thình thịch vì hồi hộp','e','面接の前は、胸がドキドキした。','Trước buổi phỏng vấn, tim tôi đập thình thịch.'],

function defState(){return{v:1,cards:{},custom:[],edits:{},deleted:{},groups:[],
  quiz:[],settings:{u:0,newPerDay:10,reviewPerDay:20,mode:'path',dir:'jp',size:20,tts:true,quiz:{scope:'all',types:['jp','vi','fill'],size:10}},log:{}}}
function norm(o){
  const r=defState();
  if(!o||typeof o!=='object')return r;
  for(const k of ['cards','edits','deleted','log'])if(o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))r[k]=o[k];
  for(const k of ['custom','groups','quiz'])if(Array.isArray(o[k]))r[k]=o[k];
  r.settings=Object.assign(r.settings,o.settings&&typeof o.settings==='object'?o.settings:{});
  return r;
}
function merge(a,b){
  const r=defState();
  const ids=new Set(Object.keys(a.cards).concat(Object.keys(b.cards)));
  ids.forEach(id=>{const x=a.cards[id],y=b.cards[id];r.cards[id]=!x?y:!y?x:((y.t||0)>(x.t||0)?y:x)});
  const byU=(list)=>{const m=new Map();list.forEach(c=>{const o=m.get(c.id);if(!o||(c.u||0)>(o.u||0))m.set(c.id,c)});return Array.from(m.values()).sort((p,q)=>p.id<q.id?-1:1)};
  r.custom=byU(a.custom.concat(b.custom));
  r.groups=byU(a.groups.concat(b.groups));
  r.quiz=Array.from(new Map(a.quiz.concat(b.quiz).map(x=>[x.t,x])).values()).sort((p,q)=>q.t-p.t).slice(0,30);
  new Set(Object.keys(a.edits).concat(Object.keys(b.edits))).forEach(id=>{const x=a.edits[id],y=b.edits[id];r.edits[id]=!x?y:!y?x:((y.u||0)>(x.u||0)?y:x)});
  new Set(Object.keys(a.deleted).concat(Object.keys(b.deleted))).forEach(id=>{r.deleted[id]=Math.max(a.deleted[id]||0,b.deleted[id]||0)});
  r.settings=(b.settings.u||0)>(a.settings.u||0)?b.settings:a.settings;
  new Set(Object.keys(a.log).concat(Object.keys(b.log))).forEach(k=>{const x=a.log[k]||{},y=b.log[k]||{};r.log[k]={n:Math.max(x.n||0,y.n||0),newc:Math.max(x.newc||0,y.newc||0),rev:Math.max(x.rev||0,y.rev||0)}});
  const keys=Object.keys(r.log).sort();if(keys.length>400)keys.slice(0,keys.length-400).forEach(k=>delete r.log[k]);
  return norm(r);
}
let S=norm((()=>{try{return JSON.parse(localStorage.getItem(LSK))}catch(e){return null}})());
function saveLocal(){try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}

let W=[],WM={};
function rebuild(){
  const out=[];
  BASE_W.concat(S.custom).forEach(w=>{if(S.deleted[w.id])return;const e=S.edits[w.id];out.push(e&&e.f?Object.assign({},w,e.f):w)});
  W=out;WM={};W.forEach(w=>{WM[w.id]=w});
}
function allGroups(){
  const gs=GROUPS0.concat(S.groups.map(g=>({id:g.id,name:g.name,sub:'Nhóm của bạn'})));
  if(W.some(w=>!(w.g||[]).some(x=>gs.some(y=>y.id===x))))gs.push({id:'x',name:'Chưa phân nhóm',sub:''});
  return gs;
}
const primary=(w,gs)=>{for(const g of gs)if((w.g||[]).indexOf(g.id)>=0)return g.id;return 'x'};
const gnames=w=>{const gs=allGroups();return(w.g||[]).map(id=>{const g=gs.find(x=>x.id===id);return g?g.name:''}).filter(Boolean).join(' · ')};

/* ---------- thẻ, cấp độ, lộ trình ---------- */
const card=id=>S.cards[id];
const seen=id=>!!(S.cards[id]&&S.cards[id].seen);
function lvl(id){const c=S.cards[id];if(!c||!c.seen)return 0;return c.box>=5?3:c.box>=3?2:1}
function logFor(){const k=dkey();return S.log[k]||(S.log[k]={n:0,newc:0,rev:0})}
function todayLog(){return S.log[dkey()]||{n:0,newc:0,rev:0}}
function dueIds(){const t=now();return W.filter(w=>{const c=S.cards[w.id];return c&&c.seen&&c.due<=t}).map(w=>w.id)}
function stages(){
  const gs=allGroups(),list=[];
  gs.forEach(g=>{
    const ids=W.filter(w=>primary(w,gs)===g.id).map(w=>w.id);if(!ids.length)return;
    let sn=0,ok=0;ids.forEach(id=>{const c=S.cards[id];if(c&&c.seen)sn++;if(c&&c.last==='ok')ok++});
    list.push({id:g.id,name:g.name,sub:g.sub,ids,n:ids.length,seen:sn,ok,done:sn===ids.length&&ok/ids.length>=PASS});
  });
  let cur=list.findIndex(s=>!s.done);if(cur<0)cur=list.length-1;
  list.forEach((s,i)=>{s.state=s.done?'done':i===cur?'current':'locked'});
  return{list,cur};
}
function goalInfo(){
  const L=todayLog(),s=S.settings,due=dueIds().length,unseen=W.filter(w=>!seen(w.id)).length;
  const newLeft=Math.max(0,Math.min(s.newPerDay-L.newc,unseen)),revLeft=Math.max(0,Math.min(s.reviewPerDay-L.rev,due));
  return{L,due,unseen,newLeft,revLeft,met:L.n>0&&newLeft===0&&revLeft===0};
}
function buildPath(size,extra){
  const t=now(),st=stages(),unl=[];
  for(let i=0;i<=st.cur&&i<st.list.length;i++)unl.push.apply(unl,st.list[i].ids);
  let q=unl.filter(id=>{const c=S.cards[id];return c&&c.seen&&c.due<=t}).sort((a,b)=>S.cards[a].due-S.cards[b].due).slice(0,size);
  const left=Math.max(0,S.settings.newPerDay-todayLog().newc),cap=Math.min(size-q.length,extra?Math.max(left,5):left);
  if(cap>0)q=q.concat(unl.filter(id=>!seen(id)).slice(0,cap));
  return q;
}
function buildAll(size){
  const ids=W.map(w=>w.id);
  return ids.filter(id=>!seen(id)).concat(ids.filter(seen).sort((a,b)=>S.cards[a].due-S.cards[b].due)).slice(0,size);
}
function buildWeak(size){
  return W.map(w=>w.id).filter(id=>{const c=S.cards[id];return c&&c.seen&&c.box<5})
    .sort((a,b)=>{const x=S.cards[a],y=S.cards[b];return(x.last==='ng'?0:1)-(y.last==='ng'?0:1)||x.box-y.box||x.due-y.due}).slice(0,size);
}
function buildFor(mode,size,extra){return mode==='path'?buildPath(size,extra):mode==='all'?buildAll(size):buildWeak(size)}
function buildList(ids,size){
  const t=now();
  return ids.slice().sort((a,b)=>{const x=S.cards[a],y=S.cards[b];
    const px=!x||!x.seen?1:x.due<=t?0:2,py=!y||!y.seen?1:y.due<=t?0:2;return px-py}).slice(0,size);
}

/* ---------- ghi nhận câu trả lời ---------- */
function applyAnswer(id,res,first){
  const t=now();let c=S.cards[id];const wasNew=!c||!c.seen;
  if(!c)c=S.cards[id]={box:0,due:0,seen:0,ok:0,ng:0,t:0};
  if(first){c.seen++;if(res==='ok')c.ok++;else c.ng++;const L=logFor();L.n++;if(wasNew)L.newc++;else L.rev++}
  if(res==='ok'){c.box=(wasNew||c.box<1)?2:(first?Math.min(5,c.box+1):Math.max(c.box,2));c.due=t+DAYS[c.box]*DAY}
  else{c.box=1;c.due=t+MIN10}
  c.last=res;c.t=t;
}
function mark(id,res){
  const t=now();let c=S.cards[id];
  if(!c)c=S.cards[id]={box:0,due:0,seen:0,ok:0,ng:0,t:0};
  if(!c.seen)c.seen=1;
  if(res==='ok'){c.box=Math.max(c.box,2);c.due=t+DAYS[c.box]*DAY;c.ok++}else{c.box=1;c.due=t+MIN10;c.ng++}
  c.last=res;c.t=t;persist();
}

let db=null,uid=null,docRef=null,syncState='local',lastRemote='',pushing=false,pushAgain=false,pushTimer=null;
function persist(){saveLocal();if(docRef)schedulePush()}
function setSync(s){syncState=s;updateTop()}
function schedulePush(){clearTimeout(pushTimer);setSync('saving');pushTimer=setTimeout(push,700)}
async function push(){
  if(!docRef)return;
  if(pushing){pushAgain=true;return}
  pushing=true;
  try{const data=JSON.parse(JSON.stringify(S));await docRef.set(data);lastRemote=canon(data);setSync('synced')}
  catch(e){setSync('error')}
  finally{pushing=false;if(pushAgain){pushAgain=false;schedulePush()}}
}
function applyRemote(d){
  lastRemote=canon(d);
  const merged=merge(S,norm(d));
  const changed=canon(merged)!==canon(S);
  S=merged;saveLocal();rebuild();
  if(changed)refresh();
  if(canon(S)!==lastRemote)schedulePush();else setSync('synced');
}
async function initCaps(){
  if(!window.claude||!window.claude.use){setSync('local');return}
  try{const user=await window.claude.use('user');uid=user?await user.id():null}catch(e){uid=null}
  try{db=await window.claude.use('db')}catch(e){db=null}
  try{sampleFn=await window.claude.use('sample')}catch(e){sampleFn=null}
  try{dl=await window.claude.use('downloads')}catch(e){dl=null}
  if(!db||!uid){setSync('local');return}
  try{
    docRef=db.doc('data/users/'+uid+'/state');
    setSync('saving');
    docRef.onSnapshot(snap=>{
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      if(snap.exists)applyRemote(snap.data());
      else{lastRemote='';schedulePush()}
    },()=>setSync('error'));
  }catch(e){docRef=null;setSync('local')}
}

function heatHtml(){
  const today=new Date();today.setHours(0,0,0,0);
  const start=new Date(today);start.setDate(start.getDate()-((today.getDay()+6)%7)-77);
  let h='';
  for(let i=0;i<84;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    if(d>today){h+='<i class="fut"></i>';continue}
    const n=(S.log[dkey(d.getTime())]||{}).n||0;
    const l=n===0?0:n<5?1:n<15?2:n<30?3:4;
    h+='<i class="l'+l+'" title="'+d.getDate()+'/'+(d.getMonth()+1)+': '+n+' thẻ"></i>';
  }
  return '<div class="heat" role="img" aria-label="Lịch học 12 tuần gần nhất">'+h+'</div>';
}
function vToday(){
  const g=goalInfo(),s=S.settings,L=g.L;
  const cnt=[0,0,0,0];W.forEach(w=>{cnt[lvl(w.id)]++});
  let ng=0,ok=0;W.forEach(w=>{const c=S.cards[w.id];if(c&&c.seen){if(c.last==='ng')ng++;else ok++}});
  const total=W.length||1;
  const date=new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'numeric'});
  const head=g.met?'Đã đạt mục tiêu hôm nay':'Còn '+g.newLeft+' từ mới và '+g.revLeft+' thẻ ôn';
  const pct=(a,b)=>b?Math.min(100,Math.round(a/b*100)):0;
  const f=forecast();
  let fc;
  if(!W.length)fc='Chưa có từ nào. Hãy thêm từ ở tab Từ vựng.';
  else if(f.done)fc='Bạn đã học qua tất cả từ. Từ giờ chỉ cần giữ nhịp ôn tập.';

  return '<div class="stack">'+

    '<div class="prow"><div class="l"><span>Từ mới</span><span>'+L.newc+'/'+s.newPerDay+'</span></div><div class="meter"><span style="width:'+pct(L.newc,s.newPerDay)+'%"></span></div></div>'+

  '<section class="panel"><h2>Dự kiến hoàn thành</h2><p>'+esc(fc)+'</p></section></div>';
}
function forecast(){
  const unseen=W.filter(w=>!seen(w.id)).length;
  if(!unseen)return{done:true};
  const act=Object.keys(S.log).sort().slice(-14).filter(k=>S.log[k].newc>0);
  let rate=Math.max(1,S.settings.newPerDay),actual=false;
  if(act.length>=3){rate=Math.max(1,act.reduce((a,k)=>a+S.log[k].newc,0)/act.length);actual=true}
  const days=Math.ceil(unseen/rate),d=new Date();d.setDate(d.getDate()+days);
  return{unseen,rate,actual,days,date:d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()};
}

function vSession(){

function vSummary(){
  const ids=Object.keys(sess.res).filter(id=>WM[id]);

function startSession(ids,label){
  ids=ids.filter(id=>WM[id]);
  if(!ids.length){toast('Không có thẻ nào để học.');return false}
  const d={};ids.forEach(id=>{d[id]=S.settings.dir==='mix'?(Math.random()<.5?'jp':'vi'):S.settings.dir});
  qz=null;sess={queue:shuffle(ids.slice()),i:0,flipped:false,res:{},first:{},rq:{},d,label,done:false};
  tab='study';window.scrollTo(0,0);render();return true;
}
function doFlip(){
  if(!sess||sess.done)return;
  if(!sess.flipped){sess.flipped=true;const c=$('#card');if(c)c.classList.add('flip');const a=$('#sactions');if(a)a.innerHTML=actsHtml()}
}
function doAnswer(res){
  if(!sess||sess.done||!sess.flipped)return;
  const before=doneSet(),metBefore=goalInfo().met;
  const id=sess.queue[sess.i],first=!sess.first[id];
  applyAnswer(id,res,first);
  if(first)sess.first[id]=res;
  sess.res[id]=res;
  if(res==='ng'&&(sess.rq[id]||0)<2){sess.rq[id]=(sess.rq[id]||0)+1;sess.queue.splice(Math.min(sess.queue.length,sess.i+5),0,id)}
  sess.i++;sess.flipped=false;
  if(sess.i>=sess.queue.length)sess.done=true;
  persist();render();
  const after=stages().list;
  after.forEach(s=>{if(s.done&&!before[s.id])toast('Hoàn thành chặng “'+s.name+'”. Chặng tiếp theo đã mở.')});
  if(!metBefore&&goalInfo().met)toast('Bạn đã đạt mục tiêu hôm nay.');
}
function doneSet(){const o={};stages().list.forEach(s=>{o[s.id]=s.done});return o}
function speechOK(){return 'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined'}
function speak(t){
  if(!speechOK())return;
  try{
    const clean=String(t).replace(/[～~（）()]/g,' ');
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(clean);u.lang='ja-JP';u.rate=.85;
    const v=speechSynthesis.getVoices().find(x=>/^ja/i.test(x.lang));if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Trắc nghiệm ---------- */
const QTYPES={jp:'Từ → chọn nghĩa',vi:'Nghĩa → chọn từ',fill:'Điền từ vào câu'};
function qset(){const s=S.settings;if(!s.quiz||!Array.isArray(s.quiz.types)||!s.quiz.types.length)s.quiz={scope:'all',types:['jp','vi','fill'],size:10};return s.quiz}
function scopeIds(sc){
  const gs=allGroups();
  return W.filter(w=>{
    const c=S.cards[w.id],sn=!!(c&&c.seen);
    if(sc==='all')return true;
    if(sc==='seen')return sn;
    if(sc==='ng')return sn&&c.last==='ng';
    if(sc==='ok')return sn&&c.last==='ok';
    if(sc.slice(0,2)==='g:')return primary(w,gs)===sc.slice(2);
    return false;
  }).map(w=>w.id);
}
function scopeOptions(){
  return [['all','Tất cả từ'],['seen','Từ đã học'],['ng','Chưa nhớ'],['ok','Đã nhớ']].concat(stages().list.map((s,i)=>['g:'+s.id,'Chặng '+(i+1)+': '+s.name]));
}
function scopeLabel(sc){const o=scopeOptions().find(x=>x[0]===sc);return o?o[1]:'Tất cả từ'}
const hira=s=>String(s).replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
function blankOf(w){
  if(!w.ex)return null;
  const base=[w.w,w.w.replace(/～ない$/,''),w.w.replace(/する$/,''),w.w.slice(0,-1)];
  for(const c of base){if(c&&c.length>=2&&w.ex.indexOf(c)>=0)return c}
  return null;
}
const cleanVi=s=>String(s||'').replace(/\s*\(Nghĩa khác:.*$/,'');
function sim(a,b){
  const ha=hira(a.w),hb=hira(b.w),sa=new Set(ha);let common=0;
  new Set(hb).forEach(ch=>{if(sa.has(ch))common++});
  let s=((a.g||[]).some(x=>(b.g||[]).indexOf(x)>=0)?10:0)+common*2;
  if(/する$/.test(a.w)===/する$/.test(b.w))s+=4;
  if(ha[0]===hb[0])s+=1;
  s-=Math.abs(ha.length-hb.length)*.6;
  return s+Math.random()*5;
}
function distractors(w,type,n){
  const txt=x=>type==='jp'?x.m:x.w,hw=hira(w.w),wm=w.m.toLowerCase(),used={};used[txt(w)]=1;
  const pool=[];
  W.forEach(x=>{
    if(x.id===w.id)return;
    const hx=hira(x.w);if(hx.indexOf(hw)>=0||hw.indexOf(hx)>=0)return;
    const xm=x.m.toLowerCase();if(xm.indexOf(wm)>=0||wm.indexOf(xm)>=0)return;
    const t=txt(x);if(used[t])return;used[t]=1;pool.push(x);
  });
  return pool.map(x=>({x,s:sim(w,x)})).sort((p,r)=>r.s-p.s).slice(0,n).map(o=>o.x);
}
function makeQuestion(w,type){
  const opts=shuffle([{id:w.id,ok:true}].concat(distractors(w,type,3).map(x=>({id:x.id,ok:false}))));
  return{id:w.id,type,opts};
}
function startQuiz(ids,label,size){
  ids=ids.filter(id=>WM[id]);
  if(!ids.length){toast('Không có từ nào trong phạm vi này.');return}
  if(W.length<2){toast('Cần ít nhất 2 từ để tạo câu hỏi.');return}
  const q=qset(),picks=shuffle(ids.slice()).slice(0,size||q.size);
  const qs=picks.map(id=>{
    const w=WM[id],av=q.types.filter(t=>t!=='fill'||blankOf(w)),pool=av.length?av:['jp'];
    return makeQuestion(w,pool[Math.floor(Math.random()*pool.length)]);
  });
  sess=null;qz={qs,i:0,picked:-1,ok:0,answered:0,wrong:[],label,done:false,saved:false};
  tab='study';window.scrollTo(0,0);render();
}
function quizPick(i){
  if(!qz||qz.done||qz.picked>=0)return;
  const q=qz.qs[qz.i];if(!q||!q.opts[i])return;
  const before=doneSet(),metBefore=goalInfo().met,ok=q.opts[i].ok;
  qz.picked=i;qz.answered++;
  applyAnswer(q.id,ok?'ok':'ng',true);
  if(ok)qz.ok++;else qz.wrong.push(q.id);
  persist();render();
  const nb=$('[data-act="qnext"]');if(nb)nb.focus({preventScroll:true});
  const fb=$('#qfb');if(fb)fb.scrollIntoView({block:'nearest',behavior:'smooth'});
  stages().list.forEach(s=>{if(s.done&&!before[s.id])toast('Hoàn thành chặng “'+s.name+'”. Chặng tiếp theo đã mở.')});
  if(!metBefore&&goalInfo().met)toast('Bạn đã đạt mục tiêu hôm nay.');
}
function finishQuiz(){
  if(qz.saved)return;
  qz.done=true;qz.saved=true;
  if(qz.answered>0){S.quiz.unshift({t:now(),n:qz.answered,ok:qz.ok,s:qz.label});S.quiz=S.quiz.slice(0,30);persist()}
}
function quizNext(){
  if(!qz||qz.done||qz.picked<0)return;
  qz.i++;qz.picked=-1;
  if(qz.i>=qz.qs.length)finishQuiz();
  window.scrollTo(0,0);render();
}
function vQuiz(){
  while(qz.i<qz.qs.length&&!WM[qz.qs[qz.i].id])qz.i++;
  if(qz.i>=qz.qs.length){finishQuiz();return vQuizSummary()}
  const q=qz.qs[qz.i],w=WM[q.id],n=qz.qs.length,done=qz.picked>=0;
  const optText=o=>{const x=WM[o.id]||{w:'',m:''};return q.type==='jp'?x.m:x.w};
  const spk=speechOK()&&S.settings.tts?'<button class="btn sm" data-act="speak" data-t="'+esc(w.r||w.w)+'">'+ICON.spk+'Nghe</button>':'';
  let prompt;
  if(q.type==='jp')prompt='<p class="lab">Chọn nghĩa đúng của từ</p><div class="qword">'+esc(w.w)+'</div>'+(w.r?'<div class="read">'+esc(w.r)+'</div>':'')+spk;
  else if(q.type==='vi')prompt='<p class="lab">Chọn từ tiếng Nhật có nghĩa này</p><div class="qvi">'+esc(w.m)+'</div>';
  else prompt='<p class="lab">Chọn từ điền vào chỗ trống</p><div class="qsent">'+esc(w.ex.replace(blankOf(w),'＿＿＿＿'))+'</div>'+(w.exVi?'<p class="exvi">Dịch: '+esc(cleanVi(w.exVi))+'</p>':'');
  const opts=q.opts.map((o,i)=>{
    let cls='opt';if(done){if(o.ok)cls+=' correct';else if(i===qz.picked)cls+=' wrong'}
    return '<button class="'+cls+'" data-act="pick" data-i="'+i+'"'+(done?' aria-disabled="true"':'')+'><span class="k">'+(i+1)+'</span><span class="'+(q.type==='jp'?'':'jp')+'">'+esc(optText(o))+'</span></button>';
  }).join('');
  let fb='';
  if(done){
    const ok=q.opts[qz.picked].ok,pw=WM[q.opts[qz.picked].id]||{w:'',m:''};
    fb='<div class="qfb '+(ok?'good':'bad')+'" id="qfb"><b>'+(ok?'Chính xác':'Chưa đúng')+'</b>'+
      (ok?'':'<p class="small">Bạn chọn '+(q.type==='jp'?'“'+esc(pw.m)+'”, đây là nghĩa của '+esc(pw.w):'“'+esc(pw.w)+'”, nghĩa là '+esc(pw.m))+'.</p>')+
      '<p><span class="jp" style="font-weight:700;font-size:1.1rem">'+esc(w.w)+'</span>'+(w.r?' <span class="small muted">（'+esc(w.r)+'）</span>':'')+': '+esc(w.m)+'</p>'+
      (w.ex?'<p class="jp">'+esc(w.ex)+'</p>'+(w.exVi?'<p class="small muted">'+esc(cleanVi(w.exVi))+'</p>':''):'')+
      '<div class="row">'+(q.type==='jp'?'':spk)+'<button class="btn primary" data-act="qnext">'+(qz.i===n-1?'Xem kết quả':'Câu tiếp')+'</button></div></div>';
  }
  return '<div class="stack"><div class="sess-h"><div><p class="eyebrow">'+esc(qz.label)+'</p><p class="small muted">Câu '+(qz.i+1)+'/'+n+' · đúng '+qz.ok+'</p></div><button class="btn sm" data-act="qexit">Dừng</button></div>'+
    '<div class="meter"><span style="width:'+(qz.i/n*100)+'%"></span></div>'+
    '<section class="panel qcard"><p class="eyebrow">'+QTYPES[q.type]+'</p>'+prompt+'</section><div class="opts">'+opts+'</div>'+fb+
    (done?'':'<p class="keys">Phím tắt: nhấn 1 đến '+q.opts.length+' để chọn đáp án</p>')+'</div>';
}
function vQuizSummary(){
  const n=qz.answered,pct=n?Math.round(qz.ok/n*100):0;

function vPath(){
  const st=stages(),n=st.list.length;
  if(!n)return '<div class="panel"><p>Chưa có từ nào.</p></div>';
  const curN=st.cur+1;
  let h='<div class="stack"><section class="panel"><h2>Lộ trình theo chặng</h2><p class="note">Mỗi chặng đạt mục tiêu khi bạn đã học hết các từ và đánh dấu nhớ ít nhất '+Math.round(PASS*100)+'%. Đạt xong chặng này mới mở chặng sau.</p>'+
    '<p><b>'+(st.list[st.cur].done?'Bạn đã hoàn thành toàn bộ lộ trình':'Bạn đang ở chặng '+curN+'/'+n)+'</b></p></section><ol class="path">';
  st.list.forEach((s,i)=>{
    const pill=s.state==='done'?'<span class="pill ok">Hoàn thành</span>':s.state==='current'?'<span class="pill cur">Đang học</span>':'<span class="pill">Chưa mở</span>';
    const pctSeen=Math.round(s.seen/s.n*100),pctOk=Math.round(s.ok/s.n*100);
    h+='<li class="stg '+s.state+'"><div class="node">'+(s.state==='done'?'✓':i+1)+'</div><div class="sbody">'+
      '<div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><div style="min-width:0"><h3>Chặng '+(i+1)+': '+esc(s.name)+'</h3><p class="small muted">'+esc(s.sub)+(s.sub?' · ':'')+s.n+' từ</p></div>'+pill+'</div>'+
      '<div class="prow"><div class="l small"><span>Đã học '+s.seen+'/'+s.n+'</span><span>'+pctSeen+'%</span></div><div class="meter"><span style="width:'+pctSeen+'%"></span></div></div>'+
      '<div class="prow"><div class="l small"><span>Đã nhớ '+s.ok+'/'+s.n+' (mục tiêu ≥ '+Math.round(PASS*100)+'%)</span><span>'+pctOk+'%</span></div><div class="meter good"><span style="width:'+pctOk+'%"></span></div></div>'+
      '<div class="row"><button class="btn sm '+(s.state==='current'?'primary':'')+'" data-act="stage" data-id="'+esc(s.id)+'"'+(s.state==='locked'?' disabled':'')+'>'+(s.state==='locked'?'Hoàn thành chặng trước để mở':s.state==='done'?'Ôn lại chặng này':'Học chặng này')+'</button>'+
      (s.state==='locked'?'<button class="btn sm" data-act="stageForce" data-id="'+esc(s.id)+'">Học thử</button>':'')+'</div></div></li>';
  });
  return h+'</ol></div>';
}

/* ---------- Từ vựng ---------- */
function filtered(){
  const q=wf.q.trim().toLowerCase();
  return W.filter(w=>{
    const c=S.cards[w.id],sn=c&&c.seen;
    if(wf.st==='new'&&sn)return false;
    if(wf.st==='ng'&&!(sn&&c.last==='ng'))return false;
    if(wf.st==='ok'&&!(sn&&c.last==='ok'))return false;
    if(wf.g&&(w.g||[]).indexOf(wf.g)<0)return false;
    if(q&&!(w.w+' '+(w.r||'')+' '+w.m+' '+(w.ex||'')+' '+(w.exVi||'')).toLowerCase().includes(q))return false;
    return true;
  });
}
function rowHtml(w){
  const c=S.cards[w.id],sn=c&&c.seen,open=openRow===w.id;
  const st=!sn?'<span class="pill">Mới</span>':c.last==='ng'?'<span class="pill ng">Chưa nhớ</span>':'<span class="pill ok">Đã nhớ</span>';
  const lv=sn?'<span class="small muted">'+LV[lvl(w.id)]+'</span>':'';
  let h='<li class="wrow"><button class="wmain" data-act="row" data-id="'+w.id+'" aria-expanded="'+open+'"><span class="wjp">'+esc(w.w)+(w.r?' <span class="small muted">（'+esc(w.r)+'）</span>':'')+'</span><span class="wvi">'+esc(w.m)+'</span><span class="wbadge">'+st+lv+'</span></button>';
  if(open){
    h+='<div class="wdet"><div><div class="exjp">'+esc(w.ex||'Chưa có câu mẫu')+'</div>'+(w.exVi?'<div class="exvi">'+esc(w.exVi)+'</div>':'')+'</div><div class="gtags">'+esc(gnames(w))+'</div><div class="row">'+
      (speechOK()?'<button class="btn sm" data-act="speak" data-t="'+esc(w.r||w.w)+'">'+ICON.spk+'Nghe</button>':'')+
      '<button class="btn sm good" data-act="markOk" data-id="'+w.id+'">Đã nhớ</button><button class="btn sm warn" data-act="markNg" data-id="'+w.id+'">Chưa nhớ</button>'+
      '<button class="btn sm" data-act="edit" data-id="'+w.id+'">'+ICON.edit+'Sửa</button>'+
      '<button class="btn sm danger" data-act="del" data-id="'+w.id+'">'+ICON.del+(confirmDel===w.id?'Bấm lần nữa để xóa':'Xóa')+'</button></div></div>';
  }
  return h+'</li>';
}

  return f.map(rowHtml).join('');
}

function saveWord(){
  const w=draft.w.trim(),m=draft.m.trim();
  if(!w||!m){toast('Hãy nhập từ vựng và nghĩa tiếng Việt.');return}
  const f={w,r:draft.r.trim(),m,ex:draft.ex.trim(),exVi:draft.exVi.trim(),g:draft.g.length?draft.g.slice():['x']};
  if(editing){
    const c=S.custom.find(x=>x.id===editing);
    if(c)Object.assign(c,f,{u:now()});else S.edits[editing]={u:now(),f};
  }else{
    if(W.some(x=>x.w===w&&x.m===m)){toast('Từ này đã có trong danh sách.');return}
    S.custom.push(Object.assign({id:'c'+now().toString(36)+Math.random().toString(36).slice(2,5),u:now()},f));
  }
  rebuild();persist();
  const wasEdit=!!editing;formOpen=false;editing=null;draft=null;render();
  toast(wasEdit?'Đã lưu thay đổi.':'Đã thêm từ mới.');
}
async function suggest(){
  if(!sampleFn)return;
  if(!draft.w.trim()){toast('Hãy nhập từ vựng trước.');return}
  const b=$('#b-suggest');if(b){b.disabled=true;b.textContent='Claude đang viết…'}
  try{
    const r=await sampleFn.json('Bạn là giáo viên tiếng Nhật, người học đang ôn trình độ N2. Hãy viết một câu mẫu ngắn, tự nhiên, trình độ N3 đến N2, có dùng từ “'+draft.w.trim()+'”'+(draft.m.trim()?' (nghĩa: '+draft.m.trim()+')':'')+', kèm bản dịch tiếng Việt. Chỉ trả lời bằng JSON, ví dụ: {"ex":"câu tiếng Nhật","exVi":"bản dịch tiếng Việt","m":"nghĩa tiếng Việt ngắn gọn của từ"}',{modelTier:'quick',cache:false});
    if(r&&r.ex){draft.ex=String(r.ex);draft.exVi=String(r.exVi||'');if(!draft.m.trim()&&r.m)draft.m=String(r.m)}
    render();toast('Đã gợi ý. Hãy đọc lại trước khi lưu.');
  }catch(e){
    const msg={not_granted:'Bạn chưa cho phép dùng Claude trong trang này.',rate_limited:'Đang gọi quá nhiều, hãy thử lại sau ít phút.'}[e&&e.code]||'Chưa gợi ý được. Bạn có thể tự nhập câu mẫu.';
    const bb=$('#b-suggest');if(bb){bb.disabled=false;bb.textContent='Gợi ý câu mẫu bằng Claude'}
    toast(msg);
  }
}

const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
function exportCsv(){
  const gs=allGroups();
  const rows=[['Từ','Nghĩa','Câu mẫu','Dịch câu mẫu','Nhóm','Cách đọc','Cấp độ','Trạng thái']];
  W.forEach(w=>{const c=S.cards[w.id];rows.push([w.w,w.m,w.ex||'',w.exVi||'',(w.g||[]).map(id=>(gs.find(x=>x.id===id)||{}).name||'').filter(Boolean).join('|'),w.r||'',LV[lvl(w.id)],!c||!c.seen?'Mới':c.last==='ng'?'Chưa nhớ':'Đã nhớ'])});
  return '﻿'+rows.map(r=>r.map(q).join(',')).join('\n');
}
function parseCSV(t){
  t=t.replace(/^﻿/,'');const rows=[];let row=[],f='',inq=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(inq){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else inq=false}else f+=c}
    else if(c==='"')inq=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  row.push(f);rows.push(row);
  return rows.filter(r=>r.some(x=>x.trim()));
}
function importText(t){
  t=t.trim();if(!t){toast('Chưa có nội dung để nhập.');return}
  if(t[0]==='{'){
    let o;try{o=JSON.parse(t)}catch(e){toast('File JSON không đọc được.');return}
    const st=o&&o.state?o.state:o;
    if(!st||typeof st!=='object'||!(st.cards||st.custom||st.log)){toast('Đây không phải bản sao lưu của trang này.');return}
    S=merge(S,norm(st));rebuild();persist();render();toast('Đã nhập bản sao lưu.');return;
  }
  const rows=parseCSV(t);
  if(rows.length&&/^(từ|tu|word)/i.test((rows[0][0]||'').trim()))rows.shift();
  let added=0,skipped=0;const gs=allGroups();
  rows.forEach(r=>{
    const w=(r[0]||'').trim(),m=(r[1]||'').trim();
    if(!w||!m){skipped++;return}
    if(W.some(x=>x.w===w&&x.m===m)){skipped++;return}
    const g=[];
    (r[4]||'').split('|').map(x=>x.trim()).filter(Boolean).forEach(name=>{
      let grp=gs.find(x=>x.name.toLowerCase()===name.toLowerCase());
      if(!grp){grp={id:'g'+now().toString(36)+Math.random().toString(36).slice(2,4),name};S.groups.push({id:grp.id,name,u:now()});gs.push(grp)}
      g.push(grp.id);
    });
    S.custom.push({id:'c'+now().toString(36)+Math.random().toString(36).slice(2,6),w,m,ex:(r[2]||'').trim(),exVi:(r[3]||'').trim(),r:(r[5]||'').trim(),g:g.length?g:['x'],u:now()});
    added++;rebuild();
  });
  rebuild();persist();render();
  toast('Đã nhập '+added+' từ'+(skipped?', bỏ qua '+skipped+' dòng trùng hoặc thiếu dữ liệu':'')+'.');
}
async function saveFile(name,text){
  if(!dl){toast('Chưa lưu file được ở đây. Hãy dùng nút Sao chép.');return}
  try{await dl.save({filename:name,data:text});toast('Đã lưu file.')}
  catch(e){if(e&&e.code!=='declined')toast('Không lưu được file. Hãy dùng nút Sao chép.')}
}

/* ---------- sự kiện ---------- */
const ACT={
  theme(){
    const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;
    try{localStorage.setItem(THK,nx)}catch(e){}
  },
  goSettings(){setTab('settings')},
  startDefault(){
    const s=S.settings,ids=buildFor(s.mode,s.size,false);
    if(!ids.length){setTab('study');return}
    startSession(ids,MODES[s.mode].n);
  },
  extra(){const ids=buildPath(S.settings.size,true);if(!ids.length){toast('Không còn từ mới để học thêm.');return}startSession(ids,'Học thêm từ mới')},
  mode(el){S.settings.mode=el.dataset.v;S.settings.u=now();persist();render()},
  dir(el){S.settings.dir=el.dataset.v;S.settings.u=now();persist();render()},
  size(el){S.settings.size=+el.dataset.v;S.settings.u=now();persist();render()},
  startStudy(){const s=S.settings;startSession(buildFor(s.mode,s.size,false),MODES[s.mode].n)},
  flip(){doFlip()},
  ok(){doAnswer('ok')},ng(){doAnswer('ng')},
  speak(el){speak(el.dataset.t)},
  exit(){sess=null;render()},
  retryNg(){const ids=Object.keys(sess.res).filter(id=>sess.res[id]==='ng');startSession(ids,'Học lại từ chưa nhớ')},
  finish(){sess=null;setTab('today')},
  kind(el){studyKind=el.dataset.v;render()},
  goQuiz(){studyKind='quiz';setTab('study')},
  qsize(el){qset().size=+el.dataset.v;S.settings.u=now();persist();render()},
  startQuiz(){const q=qset();startQuiz(scopeIds(q.scope),scopeLabel(q.scope))},
  qList(){const f=filtered().map(w=>w.id);startQuiz(f,'Danh sách đã lọc')},
  pick(el){quizPick(+el.dataset.i)},
  qnext(){quizNext()},
  qexit(){qz=null;render()},
  qRetry(){const ids=qz.wrong.slice();startQuiz(ids,'Làm lại câu sai',ids.length)},
  qCards(){const ids=qz.wrong.slice();qz=null;startSession(ids,'Ôn lại từ trả lời sai')},
  qfinish(){qz=null;setTab('today')},
  goWords(el){wf={q:'',st:el.dataset.st,g:''};setTab('words')},
  stage(el){const st=stages().list.find(s=>s.id===el.dataset.id);if(st)startSession(buildList(st.ids,S.settings.size),'Chặng: '+st.name)},
  stageForce(el){ACT.stage(el)},
  wst(el){wf.st=el.dataset.v;render()},
  row(el){openRow=openRow===el.dataset.id?null:el.dataset.id;confirmDel=null;renderList()},
  markOk(el){mark(el.dataset.id,'ok');renderList();updateTop();toast('Đã đánh dấu “Đã nhớ”.')},
  markNg(el){mark(el.dataset.id,'ng');renderList();updateTop();toast('Đã đánh dấu “Chưa nhớ”.')},
  edit(el){openForm(el.dataset.id)},
  del(el){
    const id=el.dataset.id;
    if(confirmDel!==id){confirmDel=id;renderList();return}
    S.deleted[id]=now();confirmDel=null;openRow=null;rebuild();persist();render();toast('Đã xóa từ.');
  },
  addOpen(){openForm(null)},
  formCancel(){formOpen=false;editing=null;draft=null;render()},
  formSave(){saveWord()},
  grpAdd(){
    const el=$('#f-newg'),name=el?el.value.trim():'';
    if(!name){toast('Nhập tên nhóm mới trước.');return}
    const ex=allGroups().find(g=>g.name.toLowerCase()===name.toLowerCase());
    let id;
    if(ex)id=ex.id;else{id='g'+now().toString(36)+Math.random().toString(36).slice(2,4);S.groups.push({id,name,u:now()});persist()}
    if(draft.g.indexOf(id)<0)draft.g.push(id);
    render();
  },
  suggest(){suggest()},
  startList(){const f=filtered().map(w=>w.id);if(!f.length){toast('Danh sách đang trống.');return}startSession(buildList(f,Math.max(S.settings.size,f.length>50?50:f.length)),'Danh sách đã lọc')},
  exJson(){exportText=JSON.stringify({app:'the-tu-vung-n2',exported:new Date().toISOString(),state:S},null,1);render();$('#ex')&&$('#ex').scrollIntoView({block:'center'})},
  exCsv(){exportText=exportCsv();render();$('#ex')&&$('#ex').scrollIntoView({block:'center'})},
  exSave(){const csv=exportText.charAt(0)==='﻿';saveFile(csv?'the-tu-vung-n2.csv':'the-tu-vung-n2.json',exportText)},
  async exCopy(){
    try{await navigator.clipboard.writeText(exportText);toast('Đã sao chép.')}
    catch(e){const t=$('#ex');if(t){t.focus();t.select()}toast('Hãy nhấn Ctrl+C hoặc giữ để sao chép.')}
  },
  pickFile(){const f=$('#impfile');if(f)f.click()},
  doImport(){const t=$('#imp');importText(t?t.value:'')},
  resetAsk(){
    if(!confirmReset){confirmReset=true;render();return}
    S.cards={};S.log={};S.settings.u=now();confirmReset=false;persist();render();toast('Đã xóa tiến độ học.');
  }
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab){if(tab!==t.dataset.tab){confirmReset=false;confirmDel=null}setTab(t.dataset.tab);return}
  const f=ACT[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f&&draft){draft[t.dataset.f]=t.value;return}
  if(t.id==='q'){wf.q=t.value;renderList()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.g&&draft){const id=t.dataset.g,i=draft.g.indexOf(id);if(t.checked&&i<0)draft.g.push(id);if(!t.checked&&i>=0)draft.g.splice(i,1);return}
  if(t.id==='wgroup'){wf.g=t.value;renderList()}
  if(t.id==='qscope'){qset().scope=t.value;S.settings.u=now();persist();render()}
  if(t.dataset&&t.dataset.qt){
    const qq=qset(),k=t.dataset.qt,i=qq.types.indexOf(k);
    if(t.checked&&i<0)qq.types.push(k);
    if(!t.checked&&i>=0){if(qq.types.length===1){t.checked=true;toast('Cần chọn ít nhất một dạng câu hỏi.');return}qq.types.splice(i,1)}
    S.settings.u=now();persist();
  }
  if(t.dataset&&t.dataset.set){
    const k=t.dataset.set;
    if(k==='tts')S.settings.tts=t.checked;
    else{const v=Math.max(k==='newPerDay'?1:0,Math.min(300,Math.round(+t.value||0)));S.settings[k]=v;t.value=v}
    S.settings.u=now();persist();toast('Đã lưu cài đặt.');
  }
  if(t.id==='impfile'&&t.files&&t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{const a=$('#imp');if(a)a.value=String(fr.result||'');toast('Đã đọc file. Bấm “Nhập dữ liệu” để hoàn tất.')};
    fr.onerror=()=>toast('Không đọc được file.');
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',e=>{
  const tg=e.target;if(tg&&/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))return;
  if(tab==='study'&&qz&&!qz.done){
    if(/^[1-4]$/.test(e.key)){e.preventDefault();quizPick(+e.key-1)}
    return;
  }
  if(tab!=='study'||!sess||sess.done)return;
  if(e.key===' '||e.key==='Enter'){if(tg&&tg.tagName==='BUTTON'&&tg.id!=='card')return;e.preventDefault();if(!sess.flipped)doFlip()}
  else if(sess.flipped&&(e.key==='1'||e.key==='ArrowLeft')){e.preventDefault();doAnswer('ng')}
  else if(sess.flipped&&(e.key==='2'||e.key==='ArrowRight')){e.preventDefault();doAnswer('ok')}
});

/* ---------- khởi động ---------- */
try{const th=localStorage.getItem(THK);if(th==='dark'||th==='light')document.documentElement.dataset.theme=th}catch(e){}
rebuild();render();initCaps();
})();
</script>
